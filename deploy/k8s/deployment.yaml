apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-toko-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-toko-api
  template:
    metadata:
      labels:
        app: backend-toko-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Replace RELEASE_TAG with the immutable tag of the image being released.
          image: ghcr.io/noah-isme/toko-api:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          # Schema changes are applied by deploy/k8s/migrate-job.yaml, which must
          # complete before this rollout starts.
          command: ["/app/api"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: backend-toko-secrets
            - configMapRef:
                name: backend-toko-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
