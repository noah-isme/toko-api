apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-toko-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-toko-worker
  template:
    metadata:
      labels:
        app: backend-toko-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Replace RELEASE_TAG with the immutable tag of the image being released.
          image: ghcr.io/noah-isme/toko-api:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Periodic jobs (checkout expiry, shipment tracking) stay off until
            # every API pod runs the release whose payment webhook guards PAID
            # against EXPIRED orders. See docs/ops/RUNBOOK.md "Periodic jobs".
            - name: WORKER_JOBS_ENABLED
              value: "false"
          # The worker sends order/payment/shipment email and web push, so it
          # needs the same SMTP_* and PUSH_VAPID_PUBLIC_KEY/PUSH_VAPID_PRIVATE_KEY
          # (secret) and PUSH_VAPID_SUBJECT (config) values as the API.
          envFrom:
            - secretRef:
                name: backend-toko-secrets
            - configMapRef:
                name: backend-toko-config
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
