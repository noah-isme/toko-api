apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-toko-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-toko-worker
  template:
    metadata:
      labels:
        app: backend-toko-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Replace RELEASE_TAG with the immutable tag of the image being released.
          image: ghcr.io/noah-isme/toko-api:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["/app/worker"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: backend-toko-secrets
            - configMapRef:
                name: backend-toko-config
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
