openapi: 3.1.0
info:
  title: Backend Toko API
  version: 0.2.0
  description: |
    Backend for catalogue, checkout, and webhook flows.

    **SLOs**
    - Public HTTP endpoints: p95 latency < ${PERF_SLO_HTTP_P95_MS} ms (rolling 5 minutes), error rate < ${PERF_SLO_HTTP_ERROR_RATE}.
    - Webhook dispatch: p99 latency < ${PERF_SLO_WEBHOOK_P99_MS} ms.

    **Observability**
    - Prometheus metrics at `/metrics` (namespace `toko`).
    - Alert rules defined in `deploy/prometheus/alerts.yml`.
    - Grafana dashboards located in `deploy/grafana/dashboards/`.

    **Load Testing**
    - k6 scenarios under `perf/k6` with smoke/baseline guidance in `perf/README.md`.

    **Degradation Behaviour**
    - Payment and shipping circuits return HTTP 503 with standard error schema when breakers open.
    - Webhook retries back off and land in the DLQ once max attempts are exhausted.

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns OK when the API process is running.
      responses:
        '200':
          description: Service is running
  /health/ready:
    get:
      summary: Readiness probe
      description: Checks connectivity to critical dependencies such as the database and Redis.
      responses:
        '200':
          description: Ready for traffic
        '503':
          description: Dependencies unavailable
  /metrics:
    get:
      summary: Prometheus metrics
      description: Plaintext metrics in Prometheus exposition format for scraping.
      responses:
        '200':
          description: Metrics payload
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      summary: Register
  /api/v1/auth/login:
    post:
      summary: Login
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token via cookie
  /api/v1/auth/logout:
    post:
      summary: Logout and revoke refresh session
  /api/v1/auth/me:
    get:
      summary: Me
  /api/v1/auth/password/forgot:
    post:
      summary: Send password reset email
  /api/v1/auth/password/reset:
    post:
      summary: Reset password with token
  /api/v1/users/me/addresses:
    get:
      summary: List addresses
    post:
      summary: Create address
  /api/v1/users/me/addresses/{addressID}:
    patch:
      summary: Update address
    delete:
      summary: Delete address
  /api/v1/categories:
    get:
      summary: List categories
  /api/v1/brands:
    get:
      summary: List brands
  /api/v1/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: integer
        - in: query
          name: maxPrice
          schema:
            type: integer
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - price:asc
              - price:desc
              - title:asc
              - title:desc
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
  /api/v1/products/{slug}:
    get:
      summary: Product detail
  /api/v1/products/{slug}/related:
    get:
      summary: Related products
  /api/v1/products/{id}/reviews:
    get:
      summary: List product reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Page size
      responses:
        '200':
          description: Array of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      summary: Create a product review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Created review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Server error
    delete:
      summary: Delete a product review (not implemented)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      responses:
        '501':
          description: Not implemented
  /api/v1/products/{id}/reviews/stats:
    get:
      summary: Get product review stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      responses:
        '200':
          description: Review statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStats'
        '400':
          description: Invalid product ID
        '500':
          description: Server error
  /api/v1/favorites:
    get:
      summary: List user favorites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of favorite products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
        '401':
          description: Unauthorized
        '500':
          description: Server error
    post:
      summary: Toggle favorite for a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteToggleRequest'
      responses:
        '200':
          description: Favorite toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteToggleResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Server error
  /api/v1/favorites/{id}:
    get:
      summary: Check favorite status for a product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      responses:
        '200':
          description: Favorite status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteToggleResponse'
        '400':
          description: Invalid product ID
        '401':
          description: Unauthorized
        '500':
          description: Server error
  /api/v1/carts:
    post:
      summary: Create cart (guest)
  /api/v1/carts/{id}:
    get:
      summary: Get cart by id
  /api/v1/carts/{id}/items:
    post:
      summary: Add item
  /api/v1/carts/{id}/items/{itemId}:
    patch:
      summary: Update qty
    delete:
      summary: Remove item
  /api/v1/carts/{id}/apply-voucher:
    post:
      summary: Apply voucher
  /api/v1/carts/{id}/voucher:
    delete:
      summary: Remove voucher
  /api/v1/carts/{id}/quote/shipping:
    post:
      summary: Shipping quote
  /api/v1/carts/{id}/quote/tax:
    post:
      summary: Tax quote
  /api/v1/carts/merge:
    post:
      summary: Merge guest cart into user cart
  /api/v1/checkout:
    post:
      summary: Create order (pending payment)
      description: |
        Creates an order from the user's cart, resolves the shipping address by ID,
        generates a human-readable order number, and opens a payment intent with the
        configured provider (Midtrans/Xendit).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CheckoutResponse'
        '400':
          description: Invalid request (missing fields, invalid paymentMethod, negative shippingCost)
        '401':
          description: Authentication required
        '500':
          description: Address not found, cart empty, or tenant missing
  /api/v1/orders:
    get:
      summary: List user orders
      description: Returns a paginated list of the authenticated user's orders.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Authentication required
  /api/v1/orders/{orderId}:
    get:
      summary: Get order detail
      description: Returns the full order detail including items, pricing, payment, shipping, and status history.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Authentication required
        '404':
          description: Order not found
  /api/v1/orders/{orderId}/cancel:
    post:
      summary: Cancel order if pending
  /api/v1/orders/{orderId}/shipment:
    get:
      summary: Get shipment detail for order
  /api/v1/admin/orders/{id}/shipment:
    post:
      summary: Create shipment for order
      description: Registers courier and tracking data for an order.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminShipmentCreateRequest'
      responses:
        '201':
          description: Shipment created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminShipmentResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
        '409':
          description: Conflict (invalid state or shipment already exists)
        '500':
          description: Server error
  /api/v1/admin/orders/{id}/status:
    patch:
      summary: Update order status (admin restricted)
      description: Advances the order status using state-machine validation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOrderStatusPatchRequest'
      responses:
        '204':
          description: Status updated
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Order not found
        '409':
          description: Invalid state transition
        '500':
          description: Server error
  /api/v1/admin/vouchers:
    post:
      summary: Create voucher
      description: Creates a new voucher rule.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVoucherRequest'
      responses:
        '201':
          description: Voucher created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Voucher'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Voucher code already exists
        '500':
          description: Server error
  /api/v1/admin/vouchers/{code}:
    put:
      summary: Update voucher
      description: Updates the voucher identified by its code.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Voucher code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVoucherRequest'
      responses:
        '200':
          description: Voucher updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Voucher'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Voucher not found
        '500':
          description: Server error
  /api/v1/admin/vouchers/preview:
    post:
      summary: Preview voucher discount (dry-run)
      description: Dry-run evaluation of a voucher for a given cart context.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminVoucherPreviewRequest'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/AdminVoucherPreviewResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/admin/webhooks:
    post:
      summary: Create webhook endpoint
      description: Registers a new webhook endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminWebhookEndpointRequest'
      responses:
        '201':
          description: Webhook endpoint created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
    get:
      summary: List webhook endpoints
      description: Returns configured webhook endpoints.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Items to skip
      responses:
        '200':
          description: List of endpoints
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/admin/webhooks/{id}:
    put:
      summary: Update webhook endpoint
      description: Updates the webhook endpoint identified by id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Endpoint ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminWebhookEndpointRequest'
      responses:
        '200':
          description: Webhook endpoint updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
        '500':
          description: Server error
    delete:
      summary: Delete webhook endpoint
      description: Removes the webhook endpoint identified by id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Endpoint ID
      responses:
        '204':
          description: Endpoint deleted
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Endpoint not found
        '500':
          description: Server error
  /api/v1/admin/webhook-deliveries:
    get:
      summary: List webhook deliveries
      description: Returns webhook delivery attempts with optional filtering.
      security:
        - bearerAuth: []
      parameters:
        - name: endpointId
          in: query
          schema:
            type: string
            format: uuid
          description: Endpoint ID filter
        - name: eventId
          in: query
          schema:
            type: string
            format: uuid
          description: Event ID filter
        - name: status
          in: query
          schema:
            type: string
          description: Delivery status filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Items to skip
      responses:
        '200':
          description: Deliveries and total count
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - total
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  total:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/admin/webhook-deliveries/{id}/replay:
    post:
      summary: Replay a webhook delivery
      description: Resets the delivery for retry and releases any related DLQ lock.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Delivery ID
      responses:
        '200':
          description: Delivery replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Delivery not found
        '500':
          description: Server error
  /api/v1/admin/queue/dlq:
    get:
      summary: List dead-letter queue items
      description: Returns DLQ entries filtered by kind with pagination.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema:
            type: string
          description: Queue kind filter
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Items to skip
      responses:
        '200':
          description: DLQ entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueueDLQListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/admin/queue/dlq/replay:
    post:
      summary: Replay DLQ items
      description: Re-enqueues DLQ entries either by ID list or by batch kind.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQueueReplayRequest'
      responses:
        '200':
          description: Replay result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueueReplayResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/admin/queue/stats:
    get:
      summary: Queue depth and DLQ metrics
      description: Returns queue depth, in-flight count, DLQ size, and oldest lag for a given queue kind.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
          description: Queue kind
      responses:
        '200':
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQueueStatsResponse'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/admin/audit-logs:
    get:
      summary: List audit logs (admin)
      description: Returns a paginated list of audit logs.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Items to skip
      responses:
        '200':
          description: Array of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Server error
  /api/v1/analytics/sales:
    get:
      summary: Sales trend (daily)
      description: Returns daily sales aggregates for the requested date range. Range is inclusive of `from` and exclusive of `to`.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start date as RFC3339
          example: '2025-11-01T00:00:00Z'
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End date as RFC3339
          example: '2025-12-01T00:00:00Z'
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
          description: Number of days to look back when from/to are omitted
      responses:
        '200':
          description: Daily sales aggregates
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsSalesDay'
        '400':
          description: Invalid date range
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin required)
        '500':
          description: Analytics service error
  /api/v1/analytics/top-products:
    get:
      summary: Top products by qty
      description: Returns top-selling products ordered by quantity sold.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
          description: Number of items to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of items to skip
      responses:
        '200':
          description: Top selling products
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsTopProduct'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin required)
        '500':
          description: Analytics service error
  /api/v1/analytics/overview:
    get:
      summary: Overview for dashboard
      description: Dashboard summary. Not currently implemented.
      security:
        - bearerAuth: []
      responses:
        '501':
          description: Not implemented
  /api/v1/payments/intent:
    post:
      summary: Create or reuse a payment intent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: Payment intent created or reused
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntent'
        '400':
          description: Invalid request or order not eligible
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Payment provider error
  /api/v1/webhooks/shipping/{courier}:
    post:
      summary: Shipping webhook receiver (idempotent)
      description: |
        Courier callback that appends a shipment event and updates shipment status. Payload may be sent as JSON or query parameters. Idempotent via Redis replay protection.
      parameters:
        - name: courier
          in: path
          required: true
          schema:
            type: string
          description: Courier identifier (e.g. jne, sicepat)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingWebhookPayload'
      responses:
        '204':
          description: Event recorded
        '400':
          description: Invalid request or unrecognised status
        '404':
          description: Shipment not found
        '409':
          description: Duplicate webhook payload or invalid shipment state transition
        '500':
          description: Server error
  /api/v1/payments/{orderId}/status:
    get:
      summary: Get consolidated payment status
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID to check
      responses:
        '200':
          description: Current consolidated payment status
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentStatus'
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Status lookup error
  /api/v1/webhooks/payment/{provider}:
    post:
      summary: Payment webhook receiver
      description: |
        Payment provider callback that verifies the provider signature and updates the order payment status. Request body and signature header are provider-specific.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Payment provider key (e.g. midtrans, xendit)
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: Provider-specific signature header (name varies by provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid body or order identifier
        '401':
          description: Signature verification failed
        '404':
          description: Provider not supported or payment not found
        '409':
          description: Duplicate webhook or amount mismatch
        '500':
          description: Server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CheckoutRequest:
      type: object
      required:
        - cartId
        - shippingAddressId
        - shippingService
        - shippingCost
        - paymentMethod
      properties:
        cartId:
          type: string
          format: uuid
          description: ID of the cart to check out
        shippingAddressId:
          type: string
          format: uuid
          description: ID of the user's saved shipping address (must belong to the authenticated user)
        shippingService:
          type: string
          description: Shipping service code (e.g. jne-reg)
        shippingCost:
          type: integer
          minimum: 0
          description: Shipping cost in IDR
        paymentMethod:
          type: string
          enum:
            - bank_transfer
            - virtual_account
            - credit_card
            - ewallet_gopay
            - ewallet_ovo
            - ewallet_dana
          description: Payment method for the order
        notes:
          type: string
          maxLength: 500
          description: Optional order notes
    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          description: 'Human-readable order number (ORD-YYYYMMDD-NNN)'
          example: ORD-20251207-001
        status:
          type: string
          description: Order status (lowercase)
          example: pending_payment
        total:
          type: integer
          description: Total amount in IDR
        currency:
          type: string
          example: IDR
        paymentMethod:
          type: string
          description: Echo of request paymentMethod
        paymentUrl:
          type: string
          description: Payment gateway redirect URL. Empty string if no provider configured.
        paymentExpiry:
          type: string
          format: date-time
          nullable: true
          description: When the payment intent expires. Null if no intent was created.
        createdAt:
          type: string
          format: date-time
    PaymentIntentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          format: uuid
          description: ID of the order to pay for
        channel:
          type: string
          description: Optional payment channel (e.g. snap, virtual_account)
    PaymentIntent:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          description: Payment provider identifier (e.g. midtrans, xendit, unknown)
        token:
          type: string
          description: Provider token when available
        redirectUrl:
          type: string
          format: uri
          description: Payment redirect URL when available
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Payment intent expiry time
    PaymentStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - FAILED
            - EXPIRED
            - REFUNDED
          description: Consolidated payment status (uppercase)
    AnalyticsSalesDay:
      type: object
      required:
        - day
        - paid_orders
        - all_orders
        - revenue
      properties:
        day:
          type: string
          format: date-time
          description: Aggregation day
        paid_orders:
          type: integer
          description: Paid orders in the period
        all_orders:
          type: integer
          description: Total orders in the period
        revenue:
          type: integer
          description: Gross revenue from paid orders in IDR
    AnalyticsTopProduct:
      type: object
      required:
        - product_id
        - qty_sold
        - gross
      properties:
        product_id:
          type: string
          format: uuid
          description: Product ID
        qty_sold:
          type: integer
          description: Total units sold
        gross:
          type: integer
          description: Gross revenue for the product in IDR
    Review:
      type: object
      required:
        - id
        - product_id
        - user_id
        - rating
        - created_at
        - updated_at
        - tenant_id
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
    ReviewStats:
      type: object
      required:
        - total_reviews
        - average_rating
        - count_5_star
        - count_4_star
        - count_3_star
        - count_2_star
        - count_1_star
      properties:
        total_reviews:
          type: integer
        average_rating:
          type: number
          format: float
        count_5_star:
          type: integer
        count_4_star:
          type: integer
        count_3_star:
          type: integer
        count_2_star:
          type: integer
        count_1_star:
          type: integer
    ReviewCreateRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
    Favorite:
