openapi: 3.1.0
info:
  title: Backend Toko API
  version: 0.2.0
  description: |
    Backend for catalogue, checkout, and webhook flows.

    **SLOs**
    - Public HTTP endpoints: p95 latency < 250 ms (rolling 5 minutes), error rate < 0.01.
    - Webhook dispatch: p99 latency < 1500 ms.

    **Observability**
    - Prometheus metrics at `/metrics` (namespace `toko`).
    - Alert rules defined in `deploy/prometheus/alerts.yml`.
    - Grafana dashboards located in `deploy/grafana/dashboards/`.

    **Load Testing**
    - k6 scenarios under `perf/k6` with smoke/baseline guidance in `perf/README.md`.

    **Degradation Behaviour**
    - Payment and shipping circuits return HTTP 503 with standard error schema when breakers open.
    - Webhook retries back off and land in the DLQ once max attempts are exhausted.

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns OK when the API process is running.
      responses:
        '200':
          description: Service is running
  /health/ready:
    get:
      summary: Readiness probe
      description: Checks connectivity to critical dependencies such as the database and Redis.
      responses:
        '200':
          description: Ready for traffic
        '503':
          description: Dependencies unavailable
  /metrics:
    get:
      summary: Prometheus metrics
      description: Plaintext metrics in Prometheus exposition format for scraping.
      responses:
        '200':
          description: Metrics payload
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/login:
    post:
      summary: Exchange credentials for an access token
      description: Also sets the refresh token as an HttpOnly cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/refresh:
    post:
      summary: Exchange the refresh cookie for a new access token
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Missing or invalid refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      summary: Revoke the current refresh token
      responses:
        '204':
          description: Logged out; refresh cookie cleared
  /api/v1/auth/me:
    get:
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/password/forgot:
    post:
      summary: Send a password reset email
      description: >-
        Always returns 204 so the endpoint cannot be used to discover which
        addresses are registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Accepted
  /api/v1/auth/password/reset:
    post:
      summary: Reset a password using an emailed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password updated; all sessions revoked
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/email/verify:
    post:
      summary: Verify an email address with a single-use token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Token unknown, already used, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/email/resend:
    post:
      summary: Resend the email verification link
      description: >-
        Always returns 200. Unknown and already-verified addresses are
        indistinguishable from a successful send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
  /api/v1/users/me:
    patch:
      summary: Update the current user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: No fields supplied, or name blank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Delete the authenticated account and anonymize retained orders
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Account deleted }
  /api/v1/users/me/privacy:
    get:
      summary: Get privacy preferences
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Privacy preferences } }
    put:
      summary: Save privacy preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                marketingEmails: { type: boolean }
                orderUpdates: { type: boolean }
                securityAlerts: { type: boolean }
                profileVisibility: { type: string, enum: [public, friends, private] }
                dataProcessing: { type: boolean }
                analyticsTracking: { type: boolean }
      responses: { '200': { description: Privacy preferences saved } }
  /api/v1/users/me/data-export:
    get:
      summary: Export the authenticated user's data
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: JSON data export } }
  /api/v1/users/me/addresses:
    get:
      summary: List saved addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
    post:
      summary: Create an address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Created address
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me/addresses/{addressID}:
    parameters:
      - in: path
        name: addressID
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Update an address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
        '404':
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Delete an address
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Address not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/categories:
    get:
      summary: List categories
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /api/v1/brands:
    get:
      summary: List brands
      responses:
        '200':
          description: All brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
  /api/v1/products:
    get:
      summary: List products
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: integer
        - in: query
          name: maxPrice
          schema:
            type: integer
        - in: query
          name: inStock
          schema:
            type: boolean
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - price:asc
              - price:desc
              - title:asc
              - title:desc
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
  /api/v1/products/{slug}:
    get:
      summary: Get product detail by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductDetail'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/products/{slug}/related:
    get:
      summary: List products related to a product
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'

  /api/v1/recommendations/personalized:
    get:
      summary: Get personalized product recommendations
      description: Returns personalized product recommendations for the authenticated user based on their browsing and purchase history.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Personalized recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/recommendations/trending:
    get:
      summary: Get trending products
      description: Returns currently trending/popular products across the platform.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Trending products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
  /api/v1/products/{id}/frequently-bought-together:
    get:
      summary: Get frequently bought together products
      description: Returns products frequently bought together with the specified product.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Frequently bought together products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/products/{id}/also-viewed:
    get:
      summary: Get customers also viewed products
      description: Returns products other customers viewed after viewing the specified product.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Also viewed products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductListItem'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/products/{id}/reviews:
    get:
      summary: List product reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Page size
      responses:
        '200':
          description: Array of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
    post:
      summary: Create a product review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Created review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Server error
    delete:
      summary: Delete the authenticated customer's product review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      responses:
        '204':
          description: Review deleted
        '400':
          description: Invalid product ID
        '401':
          description: Unauthorized
        '404':
          description: Review not found
        '500':
          description: Server error
  /api/v1/products/{id}/reviews/stats:
    get:
      summary: Get product review stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
      responses:
        '200':
          description: Review statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewStats'
        '400':
          description: Invalid product ID
        '500':
          description: Server error
  /api/v1/products/{id}/questions:
    get:
      summary: List product questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Product ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Array of questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionListResponse'
    post:
      summary: Ask a product question
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  minLength: 10
                  maxLength: 500
      responses:
        '201':
          description: Created question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductQuestion'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
  /api/v1/products/{id}/questions/{questionId}/answer:
    post:
      summary: Answer a product question (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - answer
              properties:
                answer:
                  type: string
                  minLength: 10
                  maxLength: 1000
      responses:
        '200':
          description: Updated question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductQuestion'
        '401':
          description: Unauthorized
        '404':
          description: Question not found
  /api/v1/products/{id}/questions/{questionId}/vote:
    post:
      summary: Vote on a product question
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - direction
              properties:
                direction:
                  type: string
                  enum: [up, clear]
      responses:
        '200':
          description: Vote recorded
        '401':
          description: Unauthorized
  /api/v1/loyalty/profile:
    get:
      summary: Get loyalty profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Loyalty profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyProfile'
        '401':
          description: Unauthorized
        '404':
          description: Profile not found
  /api/v1/loyalty/transactions:
    get:
      summary: List loyalty transactions
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: type
          in: query
          schema:
            type: string
            enum: [earned, redeemed, expired, adjusted, bonus]
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyTransactionListResponse'
        '401':
          description: Unauthorized
  /api/v1/loyalty/redeem:
    post:
      summary: Redeem a loyalty reward
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reward_id
              properties:
                reward_id:
                  type: string
      responses:
        '200':
          description: Reward redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  remaining_points:
                    type: integer
        '400':
          description: Insufficient points or invalid reward
        '401':
          description: Unauthorized
  /api/v1/push/vapid-key:
    get:
      summary: Get VAPID public key for web push
      security:
        - bearerAuth: []
      responses:
        '200':
          description: VAPID public key
          content:
            application/json:
              schema:
                type: object
                required:
                  - public_key
                properties:
                  public_key:
                    type: string
        '401':
          description: Unauthorized
  /api/v1/push/subscription:
    post:
      summary: Subscribe to web push notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
                - keys
              properties:
                endpoint:
                  type: string
                keys:
                  type: object
                  required:
                    - p256dh
                    - auth
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Missing fields
        '401':
          description: Unauthorized
    delete:
      summary: Unsubscribe from web push notifications
      security:
        - bearerAuth: []
      parameters:
        - name: endpoint
          in: query
          schema:
            type: string
          description: Subscription endpoint to remove (omit to remove all)
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Unauthorized
  /api/v1/push/preferences:
    get:
      summary: Get push notification preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Push preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushPreferences'
        '401':
          description: Unauthorized
    patch:
      summary: Update push notification preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                types:
                  type: object
                  properties:
                    order_update:
                      type: boolean
                    promo_updates:
                      type: boolean
                    stock_updates:
                      type: boolean
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushPreferences'
        '401':
          description: Unauthorized
  /api/v1/favorites:
    get:
      summary: List user favorites
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of favorite products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Favorite'
        '401':
          description: Unauthorized
        '500':
          description: Server error
    post:
      summary: Toggle favorite for a product
