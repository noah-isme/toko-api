  /api/v1/orders/{orderId}/cancel:
    post:
      summary: Cancel order if pending
      description: Runs under the order row lock with the status guard; only pending_payment orders can be cancelled (expired, paid or cancelled orders return 400 INVALID_STATE).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Order cancelled }
        '400':
          description: >
            `INVALID_STATE` when the order is not `pending_payment` (only pending orders
            can be cancelled), or `BAD_REQUEST` for an invalid order or user id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { description: Unauthorized }
        '404':
          description: '`NOT_FOUND`: no order with this id for the current user.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >
            `IDEMPOTENT_REPLAY`: the same `Idempotency-Key` was used within the TTL and
            the first response was not a 5xx.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { description: Server error }
