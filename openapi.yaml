  /api/v1/analytics/sales:
    get:
      summary: Sales trend (daily)
      description: >-
        Returns daily sales aggregates for the requested date range, bucketed by tenant-local day
        (tenants.timezone). Range is inclusive of `from` and exclusive of `to`. When `from`/`to` are
        omitted the `days` window ends at the next tenant-local midnight. Tenant-scoped (tenant from X-Tenant-ID/subdomain; 400 TENANT_REQUIRED without one). Revenue rule: an order counts iff status is PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY or DELIVERED and it is not fully refunded; order-level revenue is net (pricing_total minus PENDING and SUCCEEDED refunds; FAILED refunds ignored). See docs/contracts/analytics.md.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start date as RFC3339
          example: '2025-11-01T00:00:00Z'
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End date as RFC3339
          example: '2025-12-01T00:00:00Z'
        - name: days
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
          description: Number of whole tenant-local days to look back when from/to are omitted
      responses:
        '200':
          description: Daily sales aggregates
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsSalesDay'
        '400':
          description: Invalid date range or missing tenant (TENANT_REQUIRED)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin required)
        '500':
          description: Analytics service error
  /api/v1/analytics/top-products:
    get:
      summary: Top products by qty
      description: >-
        Returns the tenant's top-selling products ordered by quantity sold (all time unless `from`/`to`
        are given). Item-level gross: sums order_items.subtotal of orders matching the revenue rule
        (partially refunded orders keep their full item value, fully refunded orders are excluded).
        Tenant-scoped (tenant from X-Tenant-ID/subdomain; 400 TENANT_REQUIRED without one). Revenue rule: an order counts iff status is PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY or DELIVERED and it is not fully refunded; order-level revenue is net (pricing_total minus PENDING and SUCCEEDED refunds; FAILED refunds ignored). See docs/contracts/analytics.md.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of items to return (values above 100 are clamped)
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of items to skip
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: Optional inclusive lower bound on order created_at (RFC3339)
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Optional exclusive upper bound on order created_at (RFC3339); must be after `from`
      responses:
        '200':
          description: Top selling products
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsTopProduct'
        '400':
          description: Invalid range or missing tenant (TENANT_REQUIRED)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin required)
        '500':
          description: Analytics service error
  /api/v1/analytics/overview:
    get:
      summary: Overview for dashboard
      description: >-
        Aggregated order and revenue metrics for the requested date range (sum of /analytics/sales
        rows). Default window is `days` (default 30) whole tenant-local days. Tenant-scoped (tenant from X-Tenant-ID/subdomain; 400 TENANT_REQUIRED without one). Revenue rule: an order counts iff status is PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY or DELIVERED and it is not fully refunded; order-level revenue is net (pricing_total minus PENDING and SUCCEEDED refunds; FAILED refunds ignored). See docs/contracts/analytics.md.
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30, minimum: 1 }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Analytics overview }
        '400': { description: Invalid range }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Analytics service error }
  /api/v1/vouchers:
    get:
      summary: List active public vouchers
      responses: { '200': { description: Active vouchers } }
  /api/v1/flash-sales:
    get:
      summary: List scheduled and active flash-sale campaigns
      responses: { '200': { description: Flash-sale campaigns and server-calculated prices } }
  /api/v1/newsletter/subscribe:
