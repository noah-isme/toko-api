          in: query
          description: Order status filter. Omit or pass "all" for no filter.
          schema:
            type: string
            enum: [all, PENDING_PAYMENT, PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, CANCELLED, EXPIRED]
        - name: search
          in: query
          description: Match on order number, customer name, or customer email
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, description: 'RFC3339 timestamp or YYYY-MM-DD' }
        - name: endDate
          in: query
          schema: { type: string, description: 'RFC3339 timestamp or YYYY-MM-DD' }
      responses:
        '200':
          description: Order page
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminOrderSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400': { description: Invalid filter }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Server error }
  /api/v1/admin/orders/stats:
    get:
      summary: Order statistics (admin)
      description: >-
        Order counters for the tenant in [startDate, endDate). totalRevenue, revenueOrders and
        averageOrderValue follow the revenue rule; totalOrders and the status counters count every
        order. Note: a date-only startDate/endDate is UTC midnight here (unlike the
        /admin/reports endpoints, which use tenant-local midnight), so pass RFC3339 bounds with the
        tenant offset to get tenant-day totals. Tenant-scoped (tenant from X-Tenant-ID/subdomain; 400 TENANT_REQUIRED without one). Revenue rule: an order counts iff status is PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY or DELIVERED and it is not fully refunded; order-level revenue is net (pricing_total minus PENDING and SUCCEEDED refunds; FAILED refunds ignored). See docs/contracts/analytics.md.
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          description: Inclusive lower bound, RFC3339 or YYYY-MM-DD (UTC midnight)
          schema: { type: string }
        - name: endDate
          in: query
          description: Exclusive upper bound, RFC3339 or YYYY-MM-DD (UTC midnight)
          schema: { type: string }
      responses:
        '200':
          description: Aggregated order counters
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOrderStats'
        '400': { description: Invalid filter }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Server error }
  /api/v1/admin/orders/{id}:
    get:
      summary: Get order detail (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order detail with line items
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminOrderDetail'
        '400': { description: Invalid order ID }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '404': { description: Order not found }
        '500': { description: Server error }
  /api/v1/admin/vouchers/stats:
    get:
      summary: Voucher statistics (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated voucher counters
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [totalVouchers, activeVouchers, totalUsage]
                    properties:
                      totalVouchers: { type: integer }
                      activeVouchers: { type: integer }
                      totalUsage: { type: integer }
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Server error }
  /api/v1/admin/analytics/overview:
    get:
      summary: Dashboard overview (admin)
      description: >-
        Revenue, order, customer, and product counters plus top products by revenue (item-level gross
        of revenue-rule orders). totalRevenue, revenueOrders and averageOrderValue follow the revenue
        rule. Tenant-scoped (tenant from X-Tenant-ID/subdomain; 400 TENANT_REQUIRED without one). Revenue rule: an order counts iff status is PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY or DELIVERED and it is not fully refunded; order-level revenue is net (pricing_total minus PENDING and SUCCEEDED refunds; FAILED refunds ignored). See docs/contracts/analytics.md.
      security:
        - bearerAuth: []
      parameters:
        - name: range
          in: query
          description: Rolling window. Unrecognized values fall back to 30d.
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        '200':
          description: Overview metrics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminAnalyticsOverview'
        '401': { description: Unauthorized }
        '403': { description: Forbidden }
        '500': { description: Server error }
  /api/v1/admin/reports/sales-by-category:
    get:
      summary: Sales by category (admin report)
      description: >-
        Item-level sales per category for the tenant in [from, to): units, distinct orders and gross item revenue (order_items.subtotal) of orders matching the revenue rule. Partially refunded orders keep their full item value; fully refunded orders are excluded, so totals can differ from order-level revenue. Products without a category are grouped as Uncategorized (categoryId null). Sorted by revenue desc.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Report (JSON), or a CSV attachment when format=csv
          headers:
            Content-Disposition:
              description: "Only for format=csv: attachment; filename=\"sales-by-category_<from>_<to>.csv\" (tenant-local dates)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminReportSalesByCategory'
            text/csv:
              schema:
                type: string
                description: >-
                  Columns: category_id,category,category_slug,units_sold,orders,revenue,share. UTF-8 with BOM, RFC 4180 quoting; text cells starting with = + - @ TAB or CR
                  are prefixed with a single quote.
        '400': { description: "BAD_REQUEST (invalid from/to/format/categoryId, from >= to, range > 366 days) or TENANT_REQUIRED" }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (admin required) }
        '500': { description: INTERNAL }
  /api/v1/admin/reports/sales-by-product:
    get:
      summary: Sales by product (admin report, paginated)
      description: >-
        Item-level sales per product for the tenant in [from, to), same rule and amount basis as sales-by-category, sorted by revenue desc. format=csv ignores page/limit and streams up to 100,000 rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: categoryId
          in: query
          description: Only products in this category (400 BAD_REQUEST if not a UUID)
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Report (JSON), or a CSV attachment when format=csv
          headers:
            Content-Disposition:
              description: "Only for format=csv: attachment; filename=\"sales-by-product_<from>_<to>.csv\" (tenant-local dates)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination, range]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminReportProductRow'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  range:
                    $ref: '#/components/schemas/AdminReportRange'
            text/csv:
              schema:
                type: string
                description: >-
                  Columns: product_id,title,slug,category_id,category,units_sold,orders,revenue. UTF-8 with BOM, RFC 4180 quoting; text cells starting with = + - @ TAB or CR
                  are prefixed with a single quote.
        '400': { description: "BAD_REQUEST (invalid from/to/format/categoryId, from >= to, range > 366 days) or TENANT_REQUIRED" }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (admin required) }
        '500': { description: INTERNAL }
  /api/v1/admin/reports/conversion:
    get:
      summary: Checkout conversion funnel (admin report)
      description: >-
        Carts created -> checkouts started (orders created) -> paid orders for the tenant in [from, to). checkoutsStarted = paidOrders + pendingOrders + cancelledOrders + refundedOrders. Rates are 4-decimal fractions, 0 when the denominator is 0, and can exceed 1 (a cart can be checked out several times). Approximation: anonymous carts that never reach checkout are included.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Report (JSON), or a CSV attachment when format=csv
          headers:
            Content-Disposition:
              description: "Only for format=csv: attachment; filename=\"conversion_<from>_<to>.csv\" (tenant-local dates)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminReportConversion'
            text/csv:
              schema:
                type: string
                description: >-
                  One data row. Columns: from,to,timezone,carts_created,checkouts_started,paid_orders,pending_orders,cancelled_orders,refunded_orders,paid_revenue,refunded_amount,checkout_rate,payment_rate,conversion_rate. UTF-8 with BOM, RFC 4180 quoting; text cells starting with = + - @ TAB or CR
                  are prefixed with a single quote.
        '400': { description: "BAD_REQUEST (invalid from/to/format/categoryId, from >= to, range > 366 days) or TENANT_REQUIRED" }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (admin required) }
        '500': { description: INTERNAL }
  /api/v1/admin/reports/customers:
    get:
      summary: New vs returning customers (admin report)
      description: >-
        Customers (signed-in users with at least one revenue-rule order in [from, to)) split into new (first revenue-rule order at this tenant is at or after from) and returning; each user counted once. revenueFromNew + revenueFromReturning + guestRevenue equals the range's net revenue. daily is per tenant-local day over customer orders only; daily rows do not sum to the summary.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: Report (JSON), or a CSV attachment when format=csv
          headers:
            Content-Disposition:
              description: "Only for format=csv: attachment; filename=\"customers_<from>_<to>.csv\" (tenant-local dates)"
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/AdminReportCustomers'
            text/csv:
              schema:
                type: string
                description: >-
                  The daily series only. Columns: day,new_customers,returning_customers,orders,revenue. UTF-8 with BOM, RFC 4180 quoting; text cells starting with = + - @ TAB or CR
                  are prefixed with a single quote.
        '400': { description: "BAD_REQUEST (invalid from/to/format/categoryId, from >= to, range > 366 days) or TENANT_REQUIRED" }
        '401': { description: Unauthorized }
        '403': { description: Forbidden (admin required) }
        '500': { description: INTERNAL }
  /api/v1/tenant:
    get:
      summary: Get the current tenant context
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tenant metadata }
        '401': { description: Unauthorized }
  /api/v1/onboarding:
    post:
      summary: Create a new store tenant for the authenticated user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      responses:
        '201': { description: Tenant created }
        '409': { description: Tenant slug already exists }
  /api/v1/orders/{orderId}/returns:
    post:
      summary: Request a return for an eligible order
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnRequest' }
      responses:
        '201': { description: Return request created }
        '409':
          description: >
            `RETURN_NOT_ALLOWED` (order is not eligible), `RETURN_EXISTS` (an active return
            already exists) or `IDEMPOTENT_REPLAY` (same `Idempotency-Key` within the TTL).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/returns:
    get:
      summary: List the current customer's returns
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Return requests } }
  /api/v1/returns/{returnId}:
    get:
      summary: Get a return request
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Return request detail, including its refund (null when none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReturnDetail' }
  /api/v1/support/tickets:
    get:
      summary: List customer support tickets
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Support tickets } }
    post:
      summary: Open a support ticket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketRequest' }
      responses: { '201': { description: Support ticket created } }
  /api/v1/support/tickets/{ticketId}/messages:
    get:
      summary: List messages for a customer support ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ticket conversation in chronological order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SupportMessage' }
    post:
      summary: Add a message to a support ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportMessageRequest' }
      responses: { '201': { description: Message created } }
  /api/v1/admin/customers:
    get:
      summary: List customers for the current tenant
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Customer list } }
  /api/v1/admin/inventory:
    get:
      summary: List variant inventory
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Inventory list } }
  /api/v1/admin/inventory/{variantId}:
    patch:
      summary: Set or adjust variant stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: variantId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stock: { type: integer, minimum: 0 }
                delta: { type: integer }
      responses: { '200': { description: Inventory updated } }
  /api/v1/admin/returns:
    get:
      summary: List tenant return requests
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Return requests, each with its refund (null when none).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminReturn' }
  /api/v1/admin/returns/{returnId}:
    patch:
      summary: Update return workflow status
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      description: >
        `status` must be one of `APPROVED`, `REJECTED`, `RECEIVED`, `CANCELLED`. Refused while
        the return has a refund that is in flight, has an unknown gateway outcome, or was accepted
        by the gateway but not yet recorded, and once the return is `REFUNDED`.
      responses:
        '200': { description: Return status updated }
        '400': { description: Invalid return id, payload or status }
        '404': { description: Return not found in this tenant }
        '409':
          description: >
            `RETURN_REFUND_PENDING`: the return has an unsettled refund; retry the refund first
            (details `{refundId, refundStatus}`). `REFUND_ALREADY_ISSUED`: the return is
            `REFUNDED`; its status can no longer change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/admin/returns/{returnId}/refund:
    post:
      summary: Issue (or complete) a provider-backed refund for a return
      description: >
        Refunds `amount` (default: the whole remaining refundable amount of the order's payment)
        through the payment's gateway (Midtrans or Xendit). One refund per return; an order with
        several returns over time can be refunded in parts (partial refunds), and the payment
        becomes `PARTIALLY_REFUNDED` until the paid amount is fully refunded (`REFUNDED`).
        Safe to retry: every attempt uses a stable gateway key, an unknown gateway outcome is
        checked with the gateway before the same key is sent again, and a refund the gateway
        accepted but that could not be recorded (500 `REFUND_RECORD_FAILED`) is completed by
        retrying the same request without calling the gateway again.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: returnId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '200':
          description: Refund accepted by the gateway and recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RefundResponse' }
        '400':
          description: '`BAD_REQUEST`: invalid return id, malformed body, `amount <= 0`, or `reason` longer than 500 characters.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: '`NOT_FOUND`: return not found in this tenant.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >
            `REFUND_NOT_ALLOWED` (return is not `APPROVED`/`RECEIVED`);
            `REFUND_ALREADY_ISSUED` (this return already has a recorded refund);
            `PAYMENT_NOT_REFUNDABLE` (no `PAID`/`PARTIALLY_REFUNDED` payment for the order);
            `REFUND_EXCEEDS_REFUNDABLE` (`amount` larger than what is left, or nothing left; details `{requested, refundable}`);
            `REFUND_IN_PROGRESS` (another request for this return is calling the gateway, retry in about 60 s;
            or the previous attempt has an unknown outcome and the body `amount` differs from it: details
            `{refundId, pendingAmount}`, retry with that amount or without a body; or, with message
            "refund state requires reconciliation by an operator" and details `{refundId}`, the refunds
            row is in a state the API cannot resolve on its own (e.g. the payment provider changed
            since the unknown-outcome attempt, or no payment exists for an accepted refund): retrying
            does not help, an operator must reconcile it with the gateway);
            `REFUND_UNSUPPORTED` (the payment provider has no refund support);
            `IDEMPOTENT_REPLAY` (same `Idempotency-Key` within the TTL after a 2xx/4xx response).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: >
            `REFUND_RECORD_FAILED`: the gateway accepted the refund but local records could not be
            finalised. Details `{refundId, providerRef}`. Retry the same request (same or new
            `Idempotency-Key`; a 5xx releases the key) to complete it; the gateway is not called again.
            `INTERNAL`: nothing was sent to the gateway.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '502':
          description: >
            `REFUND_FAILED`: the gateway rejected the refund or did not answer; `message` carries the
            gateway error. Details `{refundId, retryable}`. `retryable: false` means the gateway
            definitively rejected it (e.g. Midtrans `412`, Xendit `INSUFFICIENT_BALANCE`): fix the cause,
            then retry (a new gateway key is used). `retryable: true` means the outcome is unknown
            (timeout, 5xx, duplicate/in-progress answer): retry as is; the same gateway key is checked and
            re-sent, so money cannot move twice. No money moved unless a later retry reports success.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/admin/support/tickets:
    get:
      summary: List tenant support tickets
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Support tickets } }
  /api/v1/admin/support/tickets/{ticketId}:
    patch:
      summary: Update support ticket status
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses: { '200': { description: Ticket status updated } }
  /api/v1/admin/support/tickets/{ticketId}/messages:
    get:
      summary: List messages for a tenant support ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ticket conversation in chronological order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SupportMessage' }
    post:
      summary: Add an agent message to a ticket
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticketId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportMessageRequest' }
      responses: { '201': { description: Message created } }
  /api/v1/admin/settings:
    get:
      summary: Read tenant store configuration
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Store configuration } }
    patch:
      summary: Update tenant store configuration
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: { '200': { description: Store configuration updated } }
  /api/v1/admin/onboarding:
    post:
      summary: Complete tenant onboarding
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: { '200': { description: Tenant onboarding saved } }

components:
  parameters:
    ReportFrom:
      name: from
      in: query
      description: >-
        Inclusive start. RFC3339 is used as-is; YYYY-MM-DD is midnight in the tenant timezone.
        Default: 30 days before `to`.
      schema: { type: string }
      example: '2026-10-01'
    ReportTo:
      name: to
      in: query
      description: >-
        Exclusive end. RFC3339 is used as-is; YYYY-MM-DD is midnight in the tenant timezone.
        Default: the next tenant-local midnight. Must be after `from`; at most 366 days after it.
      schema: { type: string }
      example: '2026-11-01'
    ReportFormat:
      name: format
      in: query
      schema: { type: string, enum: [json, csv], default: json }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: >
        Optional client-generated key (e.g. a UUID) that makes a write safe to resend. Without
        the header the request is processed normally. Within `IDEMPOTENCY_TTL_SEC` (default 600 s)
        a request repeating a key gets `409 IDEMPOTENT_REPLAY` without being processed, **except**
        that a 5xx response releases the key immediately, so the same key may be reused to retry a
        failed request (a handler panic, which ends as a 500, also releases it). Keys are global (not scoped per user or route): generate a fresh one per
        logical operation.
  schemas:
    ReturnRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
        notes: { type: string }
    FlashSaleCampaignUpdateRequest:
      type: object
      description: >
        All fields are optional but at least one must be present; absent fields are unchanged.
        `startsAt` and `endsAt` must be RFC 3339 timestamps with a timezone
        (e.g. `2026-12-01T00:00:00Z` or `2026-12-10T23:59:59+07:00`); values without a
        timezone (e.g. `2026-12-01T00:00`) are rejected with 400. `status` may be any of the four
        values but must not be empty. `items`, when present, is a full replacement keyed by `id`:
        entries with `id` update that existing item, entries without `id` are added, and existing
        items missing from the list are removed. At least one item is required (`items: []` is
        rejected). `salePrice` must be lower than the product's current price. An item with
        sales (`soldCount > 0`) cannot be removed (409) or moved to another product (400), and its
        `stockLimit` cannot drop below `soldCount`. `stockLimit` is tri-state: `null` means
        unlimited; for an entry with `id`, an absent key keeps the item's current limit; for a new
        entry, absent means unlimited. `0` is rejected with 400. Removing an item without sales also discards
        its released reservation history (`RELEASED` order rows).
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string, minLength: 1 }
        status: { type: string, enum: [DRAFT, SCHEDULED, ACTIVE, ENDED] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, salePrice]
            properties:
              id: { type: string, format: uuid, description: 'Existing item id; omit to add a new item' }
              productId: { type: string, format: uuid }
              salePrice: { type: integer, minimum: 0, description: Must be lower than the product price }
              stockLimit: { type: [integer, 'null'], minimum: 1, description: "`null` = unlimited; for an entry with `id`, an absent key keeps the item's current limit; for a new entry absent = unlimited; integer must be >= 1 and >= `soldCount`; `0` is rejected with 400" }
    FlashSaleItem:
      type: object
      required: [id, productId, title, slug, originalPrice, salePrice, discountBps, stock, soldCount]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        originalPrice: { type: integer, format: int64 }
        salePrice: { type: integer, format: int64 }
        discountBps: { type: integer, description: Discount in basis points }
        stock: { type: integer, description: 'stockLimit minus soldCount, or catalog stock when unlimited' }
        stockLimit: { type: [integer, 'null'] }
        soldCount: { type: integer }
        thumbnail: { type: [string, 'null'] }
    FlashSaleCampaign:
      type: object
      required: [id, name, slug, status, startsAt, endsAt, createdAt, updatedAt, items]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [DRAFT, SCHEDULED, ACTIVE, ENDED] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/FlashSaleItem' }
    StatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string }
    RefundRequest:
      type: object
      description: Optional body; omit it (or send `{}`) to refund the whole remaining amount.
      properties:
        amount:
          type: integer
          minimum: 1
          description: >
            Amount to refund in IDR (same unit as order totals). Defaults to the remaining
            refundable amount; must be `<= refundableAmount`. When retrying an attempt whose
            outcome is unknown, it must equal the pending amount (or be omitted).
        reason:
          type: string
          maxLength: 500
          description: >
            Free-text note, default `customer return`. Sent to the gateway (Midtrans `reason`,
            Xendit `metadata.note`). Ignored when retrying an attempt whose outcome is unknown
            (the original request is re-sent unchanged).
    RefundResponse:
      type: object
      required: [id, returnId, orderId, provider, providerRef, amount, status, refundedAmount, refundableAmount, paymentStatus, createdAt]
      properties:
        id: { type: string, format: uuid }
        returnId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        provider: { type: string, example: xendit }
        providerRef: { type: string, description: Gateway refund reference (Xendit refund id, Midtrans refund key). }
        amount: { type: integer, description: Amount of this refund. }
        status:
          type: string
          enum: [SUCCEEDED, PENDING]
          description: '`PENDING` = accepted by the gateway, settles asynchronously (money is committed; local records are final).'
        refundedAmount: { type: integer, description: Cumulative refunded amount of the order's payment. }
        refundableAmount: { type: integer, description: What can still be refunded after this refund. }
        paymentStatus: { type: string, enum: [PARTIALLY_REFUNDED, REFUNDED] }
        createdAt: { type: string, format: date-time }
    ReturnRefundSummary:
      type: object
      description: >
        The return's refund. Only `settled: true` means local records were finalised (money moved);
        `amount` may be less than the order total (partial refund).
      required: [id, status, amount, providerRef, settled, createdAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED]
          description: >
            `PENDING` with `settled: false`: gateway call in flight or outcome unknown (retry the refund).
            `FAILED`: the gateway rejected the last attempt (a retry uses a new gateway key).
        amount: { type: integer }
        providerRef: { type: string, description: Empty until the gateway accepted the refund. }
        settled: { type: boolean }
        createdAt: { type: string, format: date-time }
        providerStatus:
          type: [string, 'null']
          description: Admin endpoints only. `UNKNOWN` when the last gateway call had no definite outcome; otherwise the gateway status or rejection code.
        attempt:
          type: integer
          description: Admin endpoints only. Number of gateway keys used before the current one (starts at 0).
    ReturnDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [REQUESTED, APPROVED, REJECTED, RECEIVED, REFUNDED, CANCELLED] }
        reason: { type: string }
        notes: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        refund:
          description: Null when the return has no refund. Customer view (no `providerStatus`/`attempt`).
          oneOf:
            - $ref: '#/components/schemas/ReturnRefundSummary'
            - type: 'null'
    AdminReturn:
      allOf:
        - $ref: '#/components/schemas/ReturnDetail'
        - type: object
          properties:
            userId: { type: string, format: uuid }
            refund:
              description: Null when the return has no refund. Includes `providerStatus` and `attempt`.
              oneOf:
                - $ref: '#/components/schemas/ReturnRefundSummary'
                - type: 'null'
    SupportTicketRequest:
      type: object
      required: [subject, message]
      properties:
        subject: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        orderId: { type: string, format: uuid }
    SupportMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1 }
    SupportMessage:
      type: object
      required: [id, ticketId, authorId, authorType, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        ticketId: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        authorType: { type: string, enum: [customer, agent] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    AdminProduct:
      type: object
      required: [id, title, slug, price, inStock, stock, badges, variantCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        price: { type: integer, description: Minor currency units }
        compareAt: { type: [integer, "null"] }
        inStock: { type: boolean }
        stock: { type: integer, description: Sum of variant stock }
        thumbnail: { type: [string, "null"] }
        badges:
          type: array
          items: { type: string }
        description: { type: [string, "null"] }
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: [string, "null"] }
        brandId: { type: [string, "null"], format: uuid }
        brandName: { type: [string, "null"] }
        variantCount: { type: integer }
        sku: { type: [string, "null"], description: Primary variant SKU }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminProductDetail:
      allOf:
        - $ref: '#/components/schemas/AdminProduct'
        - type: object
          required: [images, specs, variants]
          properties:
            images:
              type: array
              items:
                type: object
                required: [id, url, sortOrder]
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string }
                  sortOrder: { type: integer }
            specs:
              type: array
              items:
                $ref: '#/components/schemas/AdminProductSpec'
            variants:
              type: array
              items:
                type: object
                required: [id, price, stock, attributes]
                properties:
                  id: { type: string, format: uuid }
                  sku: { type: [string, "null"] }
                  price: { type: integer }
                  stock: { type: integer }
                  attributes: { type: object, additionalProperties: true }
    AdminProductSpec:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
    AdminProductVariantInput:
      type: object
      description: Omit id to insert a new variant; provide id to update an existing one.
      properties:
        id: { type: string, format: uuid }
        sku: { type: [string, "null"] }
        price: { type: integer }
        stock: { type: integer }
        attributes: { type: object, additionalProperties: true }
    AdminProductCreateRequest:
      type: object
      required: [title, price]
      properties:
        title: { type: string }
        slug: { type: string, description: Derived from title when omitted }
        price: { type: integer, minimum: 0 }
        compareAt: { type: [integer, "null"] }
        inStock: { type: boolean, default: true }
        thumbnail: { type: [string, "null"] }
        badges:
          type: array
          items: { type: string }
        description: { type: [string, "null"] }
        categoryId: { type: [string, "null"], format: uuid }
        brandId: { type: [string, "null"], format: uuid }
        images:
          type: array
          items: { type: string }
        specs:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductSpec'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductVariantInput'
    AdminProductUpdateRequest:
      type: object
      description: |
        All properties are optional. Absent keys are left unchanged; an explicit
        null clears the corresponding nullable column. Supplying images or specs
        replaces the whole collection.
      properties:
        title: { type: string }
        slug: { type: string }
        price: { type: integer, minimum: 0 }
        compareAt: { type: [integer, "null"] }
        inStock: { type: boolean }
        thumbnail: { type: [string, "null"] }
        badges:
          type: array
          items: { type: string }
        description: { type: [string, "null"] }
        categoryId: { type: [string, "null"], format: uuid }
        brandId: { type: [string, "null"], format: uuid }
        images:
          type: array
          items: { type: string }
        specs:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductSpec'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AdminProductVariantInput'
    AdminTaxonomy:
      type: object
      required: [id, name, slug, productCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        parentId: { type: [string, "null"], format: uuid, description: Categories only }
        productCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminTaxonomyRequest:
      type: object
      properties:
        name: { type: string }
        slug: { type: string, description: Derived from name when omitted }
        parentId: { type: [string, "null"], format: uuid, description: Categories only }
    AdminOrderSummary:
      type: object
      required: [id, status, paymentStatus, currency, total, subtotal, discount, tax, shipping, itemsCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: [string, "null"] }
        userId: { type: [string, "null"], format: uuid }
        customerName: { type: [string, "null"] }
        customerEmail: { type: [string, "null"] }
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, PACKED, SHIPPED, OUT_FOR_DELIVERY, DELIVERED, CANCELLED, EXPIRED]
          description: EXPIRED is a system-only terminal status (payment deadline passed); an EXPIRED order with paymentStatus PAID received a late payment that needs a manual refund.
        paymentStatus: { type: string, description: "Latest payment status; empty string when no payment row exists" }
        currency: { type: string }
        total: { type: integer }
        subtotal: { type: integer }
        discount: { type: integer }
        tax: { type: integer }
        shipping: { type: integer }
        voucherCode: { type: [string, "null"] }
        itemsCount: { type: integer }
        courier: { type: [string, "null"] }
        trackingNumber: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/AdminOrderSummary'
        - type: object
          required: [shippingAddress, shippingOption, items]
          properties:
            shippingAddress: { type: object, additionalProperties: true }
            shippingOption: { type: object, additionalProperties: true }
            notes: { type: [string, "null"] }
            items:
              type: array
              items:
                type: object
                required: [id, title, slug, qty, unitPrice, subtotal]
                properties:
                  id: { type: string, format: uuid }
                  productId: { type: [string, "null"], format: uuid }
                  variantId: { type: [string, "null"], format: uuid }
                  title: { type: string }
                  slug: { type: string }
                  qty: { type: integer }
                  unitPrice: { type: integer }
                  subtotal: { type: integer }
    AdminOrderStats:
      type: object
      required: [totalOrders, totalRevenue, revenueOrders, pendingOrders, paidOrders, shippedOrders, deliveredOrders, cancelledOrders, expiredOrders, averageOrderValue]
      properties:
        totalOrders: { type: integer, description: "All orders in range, any status" }
        totalRevenue: { type: integer, description: Net revenue (IDR) of orders matching the revenue rule }
        revenueOrders: { type: integer, description: Orders matching the revenue rule }
        pendingOrders: { type: integer }
        paidOrders: { type: integer }
        shippedOrders: { type: integer }
        deliveredOrders: { type: integer }
        cancelledOrders: { type: integer }
        expiredOrders: { type: integer, description: Orders in EXPIRED (payment deadline passed) }
        averageOrderValue: { type: integer, description: "totalRevenue / revenueOrders (rounded), 0 when none" }
    AdminVoucher:
      type: object
      required: [id, code, kind, value, minSpend, usedCount, combinable, priority, productIds, categoryIds, brandIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        kind:
          type: string
          enum: [percent, fixed_amount]
        value: { type: integer }
        percentBps: { type: [integer, "null"] }
        minSpend: { type: integer }
        usageLimit: { type: [integer, "null"] }
        usedCount: { type: integer }
        perUserLimit: { type: [integer, "null"] }
        validFrom: { type: [string, "null"], format: date-time }
        validTo: { type: [string, "null"], format: date-time }
        combinable: { type: boolean }
        priority: { type: integer }
        productIds:
          type: array
          items: { type: string, format: uuid }
        categoryIds:
          type: array
          items: { type: string, format: uuid }
        brandIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminAnalyticsOverview:
      type: object
      required: [range, totalRevenue, revenueOrders, totalOrders, totalCustomers, totalProducts, averageOrderValue, topProducts]
      properties:
        range: { type: string, enum: [7d, 30d, 90d, all] }
        totalRevenue: { type: integer, description: Net revenue (IDR) of orders matching the revenue rule }
        revenueOrders: { type: integer, description: Orders matching the revenue rule }
        totalOrders: { type: integer, description: "All orders in range, any status" }
        totalCustomers: { type: integer }
        totalProducts: { type: integer }
        averageOrderValue: { type: integer, description: "totalRevenue / revenueOrders (rounded), 0 when none" }
        pendingOrders: { type: integer }
        paidOrders: { type: integer }
        shippedOrders: { type: integer }
        deliveredOrders: { type: integer }
        cancelledOrders: { type: integer }
        expiredOrders: { type: integer, description: Orders in EXPIRED (payment deadline passed) }
        topProducts:
          type: array
          items:
            type: object
            required: [productId, title, slug, unitsSold, revenue]
            properties:
              productId: { type: string, format: uuid }
              title: { type: string }
              slug: { type: string }
              unitsSold: { type: integer }
              revenue: { type: integer }
    AdminReportRange:
      type: object
      required: [from, to, timezone]
      properties:
        from: { type: string, format: date-time, description: "Resolved start, RFC3339 with the tenant offset" }
        to: { type: string, format: date-time, description: "Resolved exclusive end, RFC3339 with the tenant offset" }
        timezone: { type: string, description: IANA timezone used (UTC when the tenant value is empty or invalid) }
    AdminReportCategoryRow:
      type: object
      required: [categoryId, categoryName, categorySlug, unitsSold, orders, revenue, share]
      properties:
        categoryId: { type: [string, "null"], format: uuid, description: null for Uncategorized }
        categoryName: { type: string }
        categorySlug: { type: [string, "null"] }
        unitsSold: { type: integer }
        orders: { type: integer, description: Distinct orders containing the category }
        revenue: { type: integer, description: Gross item revenue (IDR) }
        share: { type: number, description: "revenue / totalRevenue, 4 decimals" }
    AdminReportSalesByCategory:
      allOf:
        - $ref: '#/components/schemas/AdminReportRange'
        - type: object
          required: [totalRevenue, totalUnits, rows]
          properties:
            totalRevenue: { type: integer }
            totalUnits: { type: integer }
            rows:
              type: array
              items: { $ref: '#/components/schemas/AdminReportCategoryRow' }
    AdminReportProductRow:
      type: object
      required: [productId, title, slug, categoryId, categoryName, unitsSold, orders, revenue]
      properties:
        productId: { type: [string, "null"], format: uuid }
        title: { type: string, description: Title as recorded on the order items }
        slug: { type: string }
        categoryId: { type: [string, "null"], format: uuid }
        categoryName: { type: string, description: Uncategorized when the product has no category }
        unitsSold: { type: integer }
        orders: { type: integer }
        revenue: { type: integer, description: Gross item revenue (IDR) }
    AdminReportConversion:
      allOf:
        - $ref: '#/components/schemas/AdminReportRange'
        - type: object
          required: [cartsCreated, checkoutsStarted, paidOrders, pendingOrders, cancelledOrders, refundedOrders, paidRevenue, refundedAmount, checkoutRate, paymentRate, conversionRate]
          properties:
            cartsCreated: { type: integer, description: Carts (incl. anonymous) created in range }
            checkoutsStarted: { type: integer, description: Orders created in range (one per checkout) }
            paidOrders: { type: integer, description: Orders matching the revenue rule (includes partially refunded) }
            pendingOrders: { type: integer, description: PENDING_PAYMENT }
            cancelledOrders: { type: integer, description: CANCELLED }
            refundedOrders: { type: integer, description: Revenue-status orders fully refunded (PENDING+SUCCEEDED refunds >= total) }
            paidRevenue: { type: integer, description: Net revenue (IDR) of paidOrders }
            refundedAmount: { type: integer, description: PENDING+SUCCEEDED refunds recorded against orders created in range }
            checkoutRate: { type: number, description: checkoutsStarted / cartsCreated }
            paymentRate: { type: number, description: paidOrders / checkoutsStarted }
            conversionRate: { type: number, description: paidOrders / cartsCreated }
    AdminReportCustomersDay:
      type: object
      required: [day, newCustomers, returningCustomers, orders, revenue]
      properties:
        day: { type: string, format: date, description: Tenant-local date }
        newCustomers: { type: integer, description: Users whose first revenue-rule order at this tenant is on this day }
        returningCustomers: { type: integer, description: Users ordering this day whose first order was on an earlier day }
        orders: { type: integer, description: Customer (non-guest) revenue-rule orders }
        revenue: { type: integer, description: Net revenue (IDR) of those orders }
    AdminReportCustomers:
      allOf:
        - $ref: '#/components/schemas/AdminReportRange'
        - type: object
          required: [newCustomers, returningCustomers, totalCustomers, repeatRate, ordersFromNew, ordersFromReturning, revenueFromNew, revenueFromReturning, guestOrders, guestRevenue, daily]
          properties:
            newCustomers: { type: integer }
            returningCustomers: { type: integer }
            totalCustomers: { type: integer }
            repeatRate: { type: number, description: "returningCustomers / totalCustomers, 4 decimals" }
            ordersFromNew: { type: integer }
            ordersFromReturning: { type: integer }
            revenueFromNew: { type: integer }
            revenueFromReturning: { type: integer }
            guestOrders: { type: integer }
            guestRevenue: { type: integer }
            daily:
              type: array
              items: { $ref: '#/components/schemas/AdminReportCustomersDay' }
    CheckoutRequest:
      type: object
      required:
        - cartId
        - shippingAddressId
        - shippingService
        - shippingCost
        - paymentMethod
      properties:
        cartId:
          type: string
          format: uuid
          description: ID of the cart to check out
        shippingAddressId:
          type: string
          format: uuid
          description: ID of the user's saved shipping address (must belong to the authenticated user)
        shippingService:
          type: string
          description: Shipping service code (e.g. jne-reg)
        shippingCost:
          type: integer
          minimum: 0
          description: Shipping cost in IDR
        paymentMethod:
          type: string
          enum:
            - bank_transfer
            - virtual_account
            - credit_card
            - ewallet_gopay
            - ewallet_ovo
            - ewallet_dana
          description: Payment method for the order
        notes:
          type: string
          maxLength: 500
          description: Optional order notes
    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          description: 'Human-readable order number (ORD-YYYYMMDD-NNN)'
          example: ORD-20251207-001
        status:
          type: string
          description: Order status (lowercase)
          example: pending_payment
        total:
          type: integer
          description: Total amount in IDR
        currency:
          type: string
          example: IDR
        paymentMethod:
          type: string
          description: Echo of request paymentMethod
        paymentUrl:
          type: string
          description: Payment gateway redirect URL. Empty string if no provider configured.
        paymentExpiry:
          type: string
          format: date-time
          nullable: true
          description: When the payment intent expires. Null if no intent was created.
        createdAt:
          type: string
          format: date-time
    PaymentIntentRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          format: uuid
          description: ID of the order to pay for
        channel:
          type: string
          description: Optional payment channel (e.g. snap, virtual_account)
    PaymentIntent:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          description: Payment provider identifier (e.g. midtrans, xendit, unknown)
        token:
          type: string
          description: Provider token when available
        redirectUrl:
          type: string
          format: uri
          description: Payment redirect URL when available
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Payment intent expiry time
    PaymentStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PENDING
            - PAID
            - FAILED
            - EXPIRED
            - PARTIALLY_REFUNDED
            - REFUNDED
          description: >
            Consolidated payment status (uppercase). `PARTIALLY_REFUNDED`: part of the paid amount
            was refunded; `REFUNDED`: all of it. Only the admin refund flow sets these; refund
            webhooks are recorded as payment events and do not change the status.
    AnalyticsSalesDay:
      type: object
      required:
        - day
        - paid_orders
        - all_orders
        - revenue
      properties:
        day:
          type: string
          format: date-time
          description: Tenant-local midnight of the aggregation day, with the tenant offset (e.g. 2026-10-01T00:00:00+07:00)
          example: '2026-10-01T00:00:00+07:00'
        paid_orders:
          type: integer
          description: Orders matching the revenue rule (PAID through DELIVERED, not fully refunded)
        all_orders:
          type: integer
          description: Total orders in the period (any status)
        revenue:
          type: integer
          description: Net revenue in IDR (pricing_total minus PENDING/SUCCEEDED refunds) of revenue-rule orders
    AnalyticsTopProduct:
      type: object
      required:
