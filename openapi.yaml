  /api/v1/admin/newsletter/subscribers:
    get:
      summary: List newsletter subscribers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: List of subscribers
  /api/v1/admin/flash-sales:
    post:
      summary: Create a flash-sale campaign
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, startsAt, endsAt, items]
              properties:
                name: { type: string }
                slug: { type: string }
                status: { type: string }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, salePrice]
                    properties:
                      productId: { type: string, format: uuid }
                      salePrice: { type: integer, minimum: 0 }
                      stockLimit: { type: integer, minimum: 1, nullable: true, description: 'null or absent means unlimited; 0 is rejected with 400' }
      responses: { '201': { description: Campaign created } }
  /api/v1/admin/flash-sales/{id}:
    patch:
      summary: Update a flash-sale campaign (full or partial)
      description: >
        Partial update: absent fields are left unchanged, and a bare
        `{"status": "..."}` body remains valid. The whole update runs in one
        transaction scoped to the caller's tenant. Always returns the full
        campaign. `SCHEDULED` and `ACTIVE` require the resulting `endsAt` to be
        in the future.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlashSaleCampaignUpdateRequest' }
      responses:
        '200':
          description: Campaign updated; returns the full campaign (`items` may be empty)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FlashSaleCampaign' }
        '400':
          description: >
            Invalid payload (`BAD_REQUEST`): no updatable fields, empty or unknown status,
            `endsAt` not after `startsAt`, `SCHEDULED`/`ACTIVE` with `endsAt` in the past,
            `items: []`, duplicate `productId` or item `id`, item `id` not in this campaign,
            product missing or not in this tenant, `salePrice` not lower than the product
            price, `stockLimit` below 1 or below `soldCount`, changing the product of an item
            that has sales, swapping products between existing items in one request, or
            timestamps that are not RFC 3339 with a timezone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '404':
          description: Campaign not found for this tenant (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: >
            Conflict (`CONFLICT`): slug already used in this tenant, product already in this
            campaign, removing an item that has sales or active reservations
            (`details.itemId`), or the campaign is busy (lock timeout or deadlock) and the
            request can be retried.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/payments/intent:
    post:
      summary: Create or reuse a payment intent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
      responses:
        '200':
          description: Payment intent created or reused
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentIntent'
        '400':
          description: Invalid request or order not eligible
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '409':
          description: INVALID_STATE - the order is no longer pending_payment (expired, cancelled or paid), including when that happened during the provider call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500':
          description: Payment provider error
  /api/v1/payments/{orderId}/instructions:
    get:
      summary: Get payment instructions for an order
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Payment instructions } }
  /api/v1/payments/{orderId}/proof:
    post:
      summary: Upload payment proof
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof: { type: string, format: binary }
      description: |
        Stores a transfer proof for a pending_payment order. A proof keeps the order from expiring for
        JOB_CHECKOUT_PROOF_HOLD_HOURS (default 72h) counted from the first proof, so an admin can confirm it.
      responses:
        '201': { description: Payment proof stored }
        '400': { description: Missing file or file larger than 5 MB }
        '401': { description: Unauthorized }
        '404': { description: Order not found }
        '409':
          description: INVALID_STATE - payment proof can only be uploaded for pending orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '500': { description: Server error }
  /api/v1/webhooks/shipping/{courier}:
    post:
      summary: Shipping webhook receiver (idempotent)
      description: |
        Courier callback that appends a shipment event and updates shipment status. Payload may be sent as JSON or query parameters. Idempotent via Redis replay protection.
      parameters:
        - name: courier
          in: path
          required: true
          schema:
            type: string
          description: Courier identifier (e.g. jne, sicepat)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingWebhookPayload'
      responses:
        '204':
          description: Event recorded
        '400':
          description: Invalid request or unrecognised status
        '404':
          description: Shipment not found
        '409':
          description: Duplicate webhook payload or invalid shipment state transition
        '500':
          description: Server error
  /api/v1/payments/{orderId}/status:
    get:
      summary: Get consolidated payment status
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Order ID to check
      responses:
        '200':
          description: Current consolidated payment status
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/PaymentStatus'
        '401':
          description: Unauthorized
        '404':
          description: Order not found
        '500':
          description: Status lookup error
  /api/v1/webhooks/payment/{provider}:
    post:
      summary: Payment webhook receiver
      description: |
        Payment provider callback that verifies the provider signature and updates the order payment status. Request body and signature header are provider-specific.
        Locks the order first; payment rows and events change only on real state transitions (idempotent retries).
        A PAID callback for an EXPIRED/CANCELLED order records the payment as PAID, leaves the order unchanged,
        emits the ops-only payment.late event and returns 204. Provider EXPIRED moves a pending order to EXPIRED.
        The replay key is kept only for successful (2xx) requests.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Payment provider key (e.g. midtrans, xendit)
        - name: X-Signature
          in: header
          required: false
          schema:
            type: string
          description: Provider-specific signature header (name varies by provider)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
      responses:
        '204':
          description: Webhook processed (including no-op duplicates and late payments)
        '400':
          description: Invalid body, order identifier or amount mismatch
        '401':
          description: Signature verification failed
        '404':
          description: Provider not supported, order not found or payment not found
        '409':
          description: Duplicate webhook (REPLAY)
        '500':
          description: Server error
  /api/v1/notifications:
